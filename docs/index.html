<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portfolio</title>
  <meta name="description" content="">
  <meta name="theme-color" content="#222723">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>

  <div class="page">
    <header class="topbar">
      <nav id="nav" aria-label="Sections"></nav>
    </header>

    <main id="main">
      <section class="row hero" id="top">
        <div class="col-left" id="hero-left">
          <img id="hero-avatar" class="portrait" alt="" hidden>
        </div>
        <div class="col-right">
          <h1 class="hero-lead" id="hero-title"></h1>
          <p class="hero-sub" id="hero-lede"></p>
          <p class="hero-sub" id="hero-summary"></p>
        </div>
      </section>

      <div id="sections"></div>
    </main>

    <footer class="row foot" id="footer-row" hidden>
      <div class="col-left"></div>
      <div class="col-right" id="footer"></div>
    </footer>
  </div>

  <!-- Project Side Drawer -->
  <div id="drawer-backdrop" class="drawer-backdrop" hidden></div>
  <aside id="project-drawer" class="drawer" aria-hidden="true" aria-labelledby="drawer-title" inert>
    <div class="drawer-head">
      <span class="drawer-year" id="drawer-year"></span>
      <button type="button" id="drawer-close" class="drawer-close" aria-label="Close project details">close ×</button>
    </div>
    <div class="drawer-body">
      <h2 id="drawer-title" class="drawer-title"></h2>
      <div id="drawer-media" class="drawer-media" hidden></div>
      <p id="drawer-desc" class="drawer-desc"></p>
      <p id="drawer-tags" class="drawer-tags"></p>
      <div id="drawer-links" class="drawer-links"></div>
    </div>
  </aside>

  <noscript><p class="page">This site needs JavaScript to show its content.</p></noscript>
  <script src="content.js"></script>
  <script src="main.js"></script>
</body>
</html>
